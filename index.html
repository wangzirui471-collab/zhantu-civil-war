<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20251f">
  <title>战图 · 国共内战</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23202924'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23e0c18a' font-family='serif'%3E战%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="command-room.css">
<script>(()=>{ const emptyStorage = Object.freeze({ getItem:()=>null, setItem:()=>{}, removeItem:()=>{}, clear:()=>{}, key:()=>null, length:0 }); Object.defineProperty(window,'localStorage',{value:emptyStorage, configurable:false}); Object.defineProperty(window,'sessionStorage',{value:emptyStorage, configurable:false}); Object.defineProperty(window,'indexedDB',{value:undefined, configurable:false}); })();</script>
  <script defer src="data.js"></script>
  <script defer src="portraits.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="timeline.js"></script>
  <script defer src="geography.js"></script>
  <script defer src="world-map.js"></script>
  <script defer src="korean-war-data.js"></script>
  <script defer src="human-3d.js"></script>
  <script defer src="map.js"></script>
  <script defer src="save-store.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span id="hoi-flag-badge" class="hoi-flag-badge ccp" aria-hidden="true">★</span><div><h1>战图</h1><small>HOI4 战区指挥 · 不保存进度</small></div></div>
      <div class="top-status"><span id="player-dot" class="dot ccp"></span><span id="player-name">中国共产党</span><span class="divider"></span><span id="scope-label">东北战区</span><div id="hoi-hud-stats" class="hoi-hud-stats" aria-label="国家核心指标"></div></div>
      <div class="clock-block">
        <div><time id="date"></time><span class="clock-label" id="clock-label">已暂停</span></div>
        <div class="clock-controls">
          <button id="pause" class="control" type="button" aria-label="继续或暂停" title="继续或暂停（空格）">▶</button>
          <button id="step" class="control" type="button" aria-label="前进一天" title="前进一天">▸▏</button>
          <div class="speed" aria-label="时间速度">
            <button type="button" data-speed="1" aria-pressed="true">1×</button>
            <button type="button" data-speed="2" aria-pressed="false">2×</button>
            <button type="button" data-speed="3" aria-pressed="false">3×</button>
            <button type="button" data-speed="5" aria-pressed="false">5×</button>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <details class="sys-menu" id="sys-menu">
          <summary title="系统菜单：剧本、存档、新开局、战史与说明">⚙ 菜单 ▾</summary>
          <div class="sys-menu-panel">
            <button type="button" id="mobile-scenarios">战役剧本</button>
            <button type="button" id="save-menu" disabled title="当前版本不保存进度">存档已关闭</button>
            <button type="button" id="new-game" class="gold">新开局</button>
            <button type="button" id="plans">作战计划</button>
            <button type="button" id="defense">国防建设</button>
            <button type="button" id="groups">地方派系</button>
            <button type="button" id="archive">战史档案</button>
            <button type="button" id="help">操作说明</button>
          </div>
        </details>
      </div>
    </header>
    <nav class="workbar" aria-label="主界面功能">
      <div class="workbar-tools">
        <button type="button" id="politics" class="hoi-core-btn">🏛️ 政局派系</button>
        <button type="button" id="economy" class="hoi-core-btn">🏭 经济建设</button>
        <button type="button" id="gear" class="hoi-core-btn">🎖️ 兵种军械</button>
        <button type="button" id="supply" class="hoi-core-btn">🚂 后勤补给</button>
        <button type="button" id="air-command" class="hoi-core-btn">✈️ 空军指挥</button>
        <button type="button" id="navy-command" class="hoi-core-btn">⚓ 海军指挥</button>
        <button type="button" id="history-mode" class="hoi-core-btn">📜 历史事件</button>
        <button type="button" id="world-map-btn" class="hoi-core-btn" title="1946–1953 全世界势力范围与世界地形图">🌍 世界态势</button>
        <button type="button" id="korean-war-btn" class="hoi-core-btn" title="1950–1953 抗美援朝参战国编制、航母、喷气机、坦克与火炮全库">🇰🇵 抗美援朝</button>
      </div>
      <div class="workbar-region">
        <label for="sector-select">战区</label><select id="sector-select" aria-label="选择指挥范围"></select>
        <button type="button" id="mobile-inspector" aria-controls="inspector-body" aria-expanded="false">详情抽屉</button>
      </div>
    </nav>

    <main class="workspace">
      <aside class="rail" aria-label="战役和统帅面板">
        <section class="scenario-rail">
          <div class="section-title"><h2>战役剧本</h2><button class="link-button" type="button" id="all-scenarios">全部</button></div>
          <div id="scenario-list" class="scenario-list"></div>
        </section>
        <section class="ledger-section">
          <div class="section-title"><h2>全国控制</h2><div><button class="link-button" type="button" id="territory-report">变化</button><button class="link-button" type="button" id="change-side">换边</button></div></div>
          <div id="standings" class="standings"></div>
          <dl id="resources" class="resources"></dl>
        </section>
      </aside>

      <section class="map-workspace" aria-label="战役地图">
        <canvas id="map" tabindex="0" aria-label="可缩放中国战区地图"></canvas>
        <div class="map-heading"><span class="map-tag" id="map-tag">东北战区</span><strong id="map-title">辽沈战役</strong></div>
        <div class="alert-badges" aria-label="战区提醒">
          <button type="button" id="tutorial-open" class="alert-flag" title="打开锦州战役新手引导">⚑ 锦州引导</button>
          <button type="button" id="forecast" class="alert-flag" title="推演未来数月局势预测">⚑ 局势预测</button>
        </div>
        <section id="battle-hud" class="battle-hud" aria-label="战场指挥" hidden></section>
        <div class="map-top-controls" aria-label="地图视角">
          <button type="button" id="national-view">全国</button><button type="button" id="theater-view">战区</button><button type="button" id="detail-view" title="放大查看选中部队或城镇周边">局部</button>
          <button type="button" id="night-toggle" aria-pressed="false" title="切换昼间姿态与夜间宿营睡觉姿态">🌙 夜间宿营</button>
          <button type="button" id="map-expand" aria-pressed="false" title="隐藏左侧栏，全屏沙盘视角">展开地图</button>
          <button type="button" id="find-city">查找城镇</button>
        </div>
        <div class="map-layers" aria-label="地图图层">
          <div class="map-layer-modes"><button type="button" data-layer="situation" aria-pressed="true" title="根据游戏城镇控制权推算的势力范围，非历史边界">势力范围(F1)</button><button type="button" data-layer="terrain" aria-pressed="false" title="F2 地形图">地形(F2)</button><button type="button" data-layer="faction" aria-pressed="false" title="根据驻军派系推算，非确切行政疆界">派系</button><button type="button" data-layer="contour" aria-pressed="false">等高线</button></div>
          <div class="map-layer-toggles"><button type="button" data-overlay="terrainBack" aria-pressed="true" title="在势力范围下显示地形，可独立关闭">地形底图</button><button type="button" data-overlay="rail" aria-pressed="true">铁路</button><button type="button" data-overlay="province" aria-pressed="true" title="现代省界参照">省界</button><button type="button" data-overlay="battle" aria-pressed="true" title="史料中的主要地点和大致方向">战役线</button><button type="button" data-overlay="supply" aria-pressed="false" title="F3 蓝区补给充足、黄区偏紧、红区断粮">补给(F3)</button><button type="button" data-overlay="fort" aria-pressed="true" title="已修筑的工事">工事</button><button type="button" data-overlay="maritime" aria-pressed="false">海路</button><button type="button" data-overlay="models3d" aria-pressed="true" title="显示或隐藏地图上的三维兵模">3D兵模</button></div>
        </div>
        <div id="hoi-theaters" class="hoi-theaters" aria-label="战区速览"></div>
        <div id="hoi-battle-plans" class="hoi-battle-plans" aria-label="HOI4 地图战术指令条"></div>
        <div id="general-dock" class="general-dock" aria-label="集团军将领栏"></div>
        <div class="map-legend"><span><b class="dot ccp"></b>共产党</span><span><b class="dot roc"></b>国民党</span><span><i></i>铁路</span><span><i class="attack-key"></i>进攻路线</span><span><i class="shell-key"></i>炮火</span><span><i class="supply-key"></i>补给缺口</span><span><i class="sea-key"></i>海运</span></div>
        <div id="territory-note" class="territory-note">范围按城镇控制权近似推算，非实测历史边界</div>
        <div id="faction-key" class="faction-key" hidden aria-label="派系颜色说明"></div>
        <div class="map-zoom"><button type="button" id="zoom-in" aria-label="放大">+</button><button type="button" id="zoom-out" aria-label="缩小">−</button><button type="button" id="map-reset" aria-label="回到地图中心" title="回到地图中心">⌂</button></div>
        <div class="map-help" id="map-help"></div>
        <section id="tutorial-card" class="tutorial-card" aria-label="锦州第一局" hidden></section>
      </section>

      <aside class="inspector is-hidden" aria-label="部队和城市详情">
        <div class="inspector-tabs" role="group" aria-label="详情切换"><button id="tab-city" type="button" aria-pressed="true">战区情报</button><button id="tab-army" type="button" aria-pressed="false">部队名册</button><button id="inspector-close" type="button" class="inspector-close" aria-label="收起详情抽屉" title="收起详情抽屉，释放地图视野">×</button></div>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </main>

    <section class="command-deck" aria-label="作战命令">
      <div class="deck-selection"><span id="deck-unit">作战命令</span><small id="deck-hint">在地图上点击部队牌</small></div>
      <div id="command-bar" class="command-actions"></div>
    </section>
    <footer class="bottom">
      <span class="log-label">战况简报</span><button type="button" id="latest-event" aria-live="polite">请选择部队或城镇。</button>
      <div class="brief-toolbar">
        <button type="button" id="brief-settings" class="link-button">自动暂停</button>
        <button type="button" id="show-log" class="link-button">查看记录</button>
      </div>
    </footer>
  </div>

  <dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><span class="dialog-head-actions"><button type="button" id="tutorial-skip" class="dialog-skip" hidden>跳过教程</button><button type="button" id="dialog-close" class="control" aria-label="关闭">×</button></span></div><div id="dialog-body" class="dialog-body"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
</body>
</html>
